name: Drive — Indexação Facial Banco Qualificados

on:
  schedule:
    - cron: "0 */2 * * *"   # a cada 2 horas
  workflow_dispatch:         # disparo manual

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Indexar rostos do Drive Banco Qualificados
        env:
          INDEX_URL: https://intel-facial-42bpm.netlify.app/api/drive/index-faces
          IMPORT_TOKEN: ${{ secrets.IBIS_IMPORT_TOKEN }}
        run: |
          remaining=1
          rounds=0
          max_rounds=50   # até 50 × 10 = 500 rostos por execução (dentro do timeout de 55min)

          while [ "$remaining" -gt 0 ] && [ "$rounds" -lt "$max_rounds" ]; do
            response=$(curl -s -X POST "$INDEX_URL" \
              -H "Content-Type: application/json" \
              -H "x-import-token: $IMPORT_TOKEN" \
              -d '{"limit":5}' \
              --max-time 55) || true

            ok=$(echo "$response"       | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ok',''))"        2>/dev/null || echo "")
            embedded=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('embedded',0))"   2>/dev/null || echo "0")
            skipped=$(echo "$response"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('skipped',0))"    2>/dev/null || echo "0")
            remaining=$(echo "$response"| python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('remaining',0))"  2>/dev/null || echo "0")

            rounds=$((rounds + 1))
            echo "Rodada $rounds: embedded=$embedded skipped=$skipped remaining=$remaining"

            if [ "$ok" != "True" ] && [ "$ok" != "true" ]; then
              echo "Erro ou face service offline — abortando."
              echo "Resposta: $response"
              break
            fi

            if [ "$remaining" -gt 0 ]; then
              sleep 3
            fi
          done

          echo "Concluído: $rounds rodadas."
