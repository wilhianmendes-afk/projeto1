name: Drive - Indexacao Facial BQ

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:         # disparo manual

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Indexar rostos do Drive Banco Qualificados
        env:
          INDEX_URL: https://intel-facial-42bpm.netlify.app/api/drive/index-faces
          IMPORT_TOKEN: ${{ secrets.IBIS_IMPORT_TOKEN }}
        run: |
          cursor="null"
          rounds=0
          max_rounds=200
          total_embedded=0
          total_skipped=0

          while [ "$rounds" -lt "$max_rounds" ]; do
            echo "{\"limit\":5,\"cursor\":$cursor}" > /tmp/req.json
            response=$(curl -s -X POST "$INDEX_URL" \
              -H "Content-Type: application/json" \
              -H "x-import-token: $IMPORT_TOKEN" \
              -d @/tmp/req.json \
              --max-time 30) || true

            ok=$(echo "$response"       | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ok',''))"        2>/dev/null || echo "")
            embedded=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('embedded',0))"   2>/dev/null || echo "0")
            skipped=$(echo "$response"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('skipped',0))"    2>/dev/null || echo "0")
            done_flag=$(echo "$response"| python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('done',False))"   2>/dev/null || echo "False")
            cursor=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); c=d.get('nextCursor'); print('null' if c is None else json.dumps(c))" 2>/dev/null || echo "null")

            rounds=$((rounds + 1))
            total_embedded=$((total_embedded + embedded))
            total_skipped=$((total_skipped + skipped))

            if [ "$ok" != "True" ] && [ "$ok" != "true" ]; then
              echo "Rodada $rounds: erro — abortando. Resposta: $response"
              break
            fi

            echo "Rodada $rounds: embedded=$embedded skipped=$skipped done=$done_flag"

            if [ "$done_flag" = "True" ] || [ "$cursor" = "null" ]; then
              echo "Ciclo completo."
              break
            fi

            sleep 1
          done

          echo "Total: embedded=$total_embedded skipped=$total_skipped em $rounds rodadas."
