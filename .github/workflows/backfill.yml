name: Backfill de Embeddings

on:
  schedule:
    - cron: '0 */2 * * *'   # a cada 2 horas
  workflow_dispatch:          # permite rodar manualmente pelo GitHub

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Processar embeddings pendentes
        env:
          BACKFILL_URL: https://intel-facial-42bpm.netlify.app/api/face/backfill
          BACKFILL_TOKEN: ${{ secrets.IBIS_IMPORT_TOKEN }}
        run: |
          remaining=1
          rounds=0
          max_rounds=20   # segurança: no máximo 20 chamadas por execução

          while [ "$remaining" -gt 0 ] && [ "$rounds" -lt "$max_rounds" ]; do
            response=$(curl -s -X POST "$BACKFILL_URL" \
              -H "Content-Type: application/json" \
              -H "x-backfill-token: $BACKFILL_TOKEN" \
              -d '{"limit":5}' \
              --max-time 55)

            ok=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ok',''))" 2>/dev/null)
            embedded=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('embedded',0))" 2>/dev/null)
            remaining=$(echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('remaining',0))" 2>/dev/null)

            rounds=$((rounds + 1))
            echo "Rodada $rounds: embedded=$embedded remaining=$remaining"

            if [ "$ok" != "True" ] && [ "$ok" != "true" ]; then
              echo "Backfill retornou erro ou face service offline — abortando."
              break
            fi

            if [ "$remaining" -gt 0 ]; then
              sleep 2
            fi
          done

          echo "Concluído: $rounds rodadas processadas."
